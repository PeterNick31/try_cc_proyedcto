service: itsm-problemas
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    PROBLEMAS_TABLE: ${self:service}-${sls:stage}-problemas
    EVENTS_TOPIC_ARN: ${ssm:/itsm/${sls:stage}/sns-eventos-arn}
    JWT_SECRET: ${ssm:/itsm/${sls:stage}/jwt-secret~true, env:JWT_SECRET}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

functions:
  authorizer:
    handler: src.common.auth.authorize
    timeout: 5
  api:
    handler: src.handlers.problemas.handler
    timeout: 15
    events:
      - http:
          path: problemas
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/resumen
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}
          method: put
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}
          method: delete
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}/estado
          method: patch
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}/causa-raiz
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
      - http:
          path: problemas/{id}/incidentes
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0
  consumeEvents:
    handler: src.consumers.events.handler
    timeout: 30
    events:
      - sqs:
          arn: ${ssm:/itsm/${sls:stage}/q-problemas-arn}
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    ProblemasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PROBLEMAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: problema_id
            AttributeType: S
          - AttributeName: estado_creado_en
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: problema_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: estado-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: estado_creado_en
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    Default4xxGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
    Default5xxGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  Outputs:
    ProblemasApiUrl:
      Description: Base URL for the Problemas API
      Value:
        Fn::Join:
          - ""
          - - https://
            - Ref: ApiGatewayRestApi
            - .execute-api.
            - ${self:provider.region}
            - .amazonaws.com/
            - ${sls:stage}
    ProblemasTableName:
      Value:
        Ref: ProblemasTable
